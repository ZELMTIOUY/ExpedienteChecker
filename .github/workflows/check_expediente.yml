name: ExpedienteChecker — Comprobación Automática

on:
  schedule:
    # Runs every 30 minutes (GitHub minimum is 5 min, but 30 is safer for rate limits)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # Manual trigger from GitHub UI → Actions tab

jobs:
  check-expediente:
    runs-on: ubuntu-latest   # Free GitHub-hosted runner — no self-hosted needed

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 3. Build fat JAR ───────────────────────────────────────────────────
      - name: 3. Build fat JAR (maven-assembly-plugin)
        run: mvn -B package --no-transfer-progress

      # ── 4. Install Playwright Chromium ─────────────────────────────────────
      - name: 4. Install Playwright Chromium browser
        run: mvn -B exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install chromium --with-deps" --no-transfer-progress

      # ── 5. Run the bot ─────────────────────────────────────────────────────
      - name: 5. Run ExpedienteChecker
        env:
          MY_NIE:           ${{ secrets.MY_NIE }}
          FECHA_SOLICITUD:  ${{ secrets.FECHA_SOLICITUD }}
          ANIO_NACIMIENTO:  ${{ secrets.ANIO_NACIMIENTO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:          ${{ secrets.CHAT_ID }}
        run: java -jar target/expediente-checker.jar

      # ── 6. Upload screenshots (always, for debugging) ──────────────────────
      - name: 6. Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 5
