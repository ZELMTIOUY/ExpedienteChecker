name: Check Expediente

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # ajusta a la frecuencia que quieras

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # da margen a los minutos de espera del CAPTCHA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B package --no-transfer-progress

      # Reemplaza el "apt-get install" manual: --with-deps instala automáticamente
      # los paquetes de sistema correctos para la versión de Ubuntu del runner,
      # en vez de una lista fija que se rompe cuando GitHub cambia de imagen.
      - name: Install Playwright Chromium + OS deps
        run: mvn -B exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps chromium" --no-transfer-progress

      - name: Run ExpedienteChecker
        env:
          MY_NIE: ${{ secrets.MY_NIE }}
          FECHA_SOLICITUD: ${{ secrets.FECHA_SOLICITUD }}
          ANIO_NACIMIENTO: ${{ secrets.ANIO_NACIMIENTO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CAPTCHA_WAIT_MINUTES: "5"
        run: java -jar target/expediente-checker.jar

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-screenshots-${{ github.run_number }}
          path: screenshots/
