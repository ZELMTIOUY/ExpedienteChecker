name: Check Expediente

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # ajusta a la frecuencia que quieras

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # da margen a los minutos de espera del CAPTCHA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B package --no-transfer-progress

      # NOTA: no usamos "mvn exec:java -Dexec.mainClass=..." aquí a propósito.
      # El pom.xml de este proyecto tiene el exec-maven-plugin con el mainClass
      # fijado directamente a ExpedienteChecker (no a la propiedad ${exec.mainClass}),
      # así que "-Dexec.mainClass" en la línea de comandos NO tiene efecto y
      # mvn exec:java siempre lanza el bot completo, no la CLI de Playwright.
      # Por eso invocamos java -cp directamente contra el uber-jar ya construido,
      # que sí ejecuta la clase que pedimos.
      - name: Install Playwright Chromium + OS deps
        run: java -cp target/expediente-checker.jar com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run ExpedienteChecker
        env:
          MY_NIE: ${{ secrets.MY_NIE }}
          FECHA_SOLICITUD: ${{ secrets.FECHA_SOLICITUD }}
          ANIO_NACIMIENTO: ${{ secrets.ANIO_NACIMIENTO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CAPTCHA_WAIT_MINUTES: "5"
        run: java -jar target/expediente-checker.jar

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-screenshots-${{ github.run_number }}
          path: screenshots/
