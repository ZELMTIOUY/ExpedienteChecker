name: ExpedienteChecker — Comprobación Automática

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:           # Manual trigger from GitHub UI → Actions tab

jobs:
  check-expediente:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 3. Install Playwright system dependencies via apt ──────────────────
      #  This fixes the "missing libraries" warning (libwoff2dec, libvpx, etc.)
      #  We install them directly via apt BEFORE launching any browser.
      - name: 3. Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwoff1 \
            libvpx7 \
            libevent-2.1-7 \
            libopus0 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libharfbuzz-icu0 \
            libsecret-1-0 \
            libhyphen0 \
            libgles2 \
            libx264-dev \
            fonts-liberation \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libnspr4 \
            libnss3 \
            libxss1 \
            xdg-utils \
          || true

      # ── 4. Build fat JAR ───────────────────────────────────────────────────
      - name: 4. Build fat JAR
        run: mvn -B package --no-transfer-progress

      # ── 5. Install Playwright Chromium browser binary ──────────────────────
      - name: 5. Install Playwright Chromium
        run: mvn -B exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install chromium" --no-transfer-progress

      # ── 6. Run the bot ─────────────────────────────────────────────────────
      - name: 6. Run ExpedienteChecker
        env:
          MY_NIE:           ${{ secrets.MY_NIE }}
          FECHA_SOLICITUD:  ${{ secrets.FECHA_SOLICITUD }}
          ANIO_NACIMIENTO:  ${{ secrets.ANIO_NACIMIENTO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:          ${{ secrets.CHAT_ID }}
        run: java -jar target/expediente-checker.jar

      # ── 7. Upload screenshots (always — for debugging) ─────────────────────
      - name: 7. Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 5
